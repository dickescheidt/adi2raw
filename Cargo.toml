[package]
name = "adi2raw"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Stream an AOMEI Backupper .adi disk image as a raw disk image to stdout"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dickescheidt/adi2raw"
homepage = "https://github.com/dickescheidt/adi2raw"
keywords = ["aomei", "backup", "disk-image", "restore", "raw"]
categories = ["command-line-utilities"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
